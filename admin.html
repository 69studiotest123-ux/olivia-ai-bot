<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>69 Studio | AI Bot Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #38bdf8;
            --bg: #0f172a;
            --card: #1e293b;
            --glass: rgba(30, 41, 59, 0.7);
            --user: #facc15;
            --bot: #4ade80;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: #f1f5f9;
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        .header {
            background: var(--card);
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #334155;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: var(--card);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #334155;
            text-align: center;
        }

        .stat-card h3 { margin: 0; color: #94a3b8; font-size: 0.9rem; text-transform: uppercase; }
        .stat-card p { margin: 10px 0 0; font-size: 2rem; font-weight: 600; color: var(--primary); }

        .chat-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .user-card {
            background: var(--glass);
            border-radius: 20px;
            border: 1px solid #334155;
            overflow: hidden;
            transition: transform 0.3s ease;
        }

        .user-card:hover { border-color: var(--primary); }

        .user-header {
            background: #ffffff05;
            padding: 15px 20px;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .user-header h2 { margin: 0; font-size: 1rem; color: #818cf8; }

        .messages {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .msg-bubble {
            max-width: 85%;
            padding: 12px 16px;
            border-radius: 18px;
            line-height: 1.5;
            font-size: 0.95rem;
        }

        .msg-user {
            align-self: flex-start;
            background: #facc1515;
            border: 1px solid #facc1533;
            color: #fef08a;
            border-bottom-left-radius: 4px;
        }

        .msg-bot {
            align-self: flex-end;
            background: #4ade8015;
            border: 1px solid #4ade8033;
            color: #bbf7d0;
            border-bottom-right-radius: 4px;
        }

        .refresh-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: var(--primary);
            color: #000;
            border: none;
            padding: 15px 25px;
            border-radius: 30px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loading { text-align: center; padding: 50px; color: #94a3b8; }
    </style>
</head>
<body>

    <div class="header">
        <h1>69 STUDIO AI COMMAND CENTER</h1>
    </div>

    <div class="container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Active Chats</h3>
                <p id="totalChats">0</p>
            </div>
            <div class="stat-card">
                <h3>System Status</h3>
                <p style="color: #4ade80;">Online</p>
            </div>
        </div>

        <div id="logsContainer" class="chat-list">
            <div class="loading">Loading intelligence data...</div>
        </div>
    </div>

    <button class="refresh-btn" onclick="loadLogs()">⚡ Refresh Data</button>

    <script>
        let password = new URLSearchParams(window.location.search).get('pass');
        
        async function loadLogs() {
            if (!password || password === 'undefined') {
                password = prompt("Please enter Admin Password:");
                if (!password) {
                    document.getElementById('logsContainer').innerHTML = '<div class="loading" style="color: #f87171">Error: Password is required.</div>';
                    return;
                }
                // Update URL for convenience
                window.history.replaceState(null, '', `?pass=${password}`);
            }

            try {
                const response = await fetch(`/api/logs?pass=${password}`);
                if (!response.ok) {
                    if (response.status === 403) {
                        password = null; // Reset to trigger prompt next time
                        document.getElementById('logsContainer').innerHTML = '<div class="loading" style="color: #f87171">Access Denied / Invalid Password</div>';
                    }
                    throw new Error('Unauthorized');
                }
                
                const data = await response.json();
                renderLogs(data);
            } catch (err) {
                // Error handled above
            }
        }

        function renderLogs(data) {
            const container = document.getElementById('logsContainer');
            document.getElementById('totalChats').innerText = Object.keys(data).length;

            if (Object.keys(data).length === 0) {
                container.innerHTML = '<div class="loading">No conversations recorded yet.</div>';
                return;
            }

            let html = '';
            for (const [jid, msgs] of Object.entries(data)) {
                html += `
                    <div class="user-card">
                        <div class="user-header">
                            <h2>📍 Contact: ${jid.split('@')[0]}</h2>
                            <span style="font-size: 0.8rem; color: #64748b">${msgs.length} messages</span>
                        </div>
                        <div class="messages">
                            ${msgs.map(m => `
                                <div class="msg-bubble ${m.role === 'user' ? 'msg-user' : 'msg-bot'}">
                                    <strong>${m.role === 'user' ? 'Customer' : 'AI Bot'}:</strong><br>
                                    ${m.text}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            container.innerHTML = html;
        }

        loadLogs();
        setInterval(loadLogs, 15000); // Auto refresh
    </script>
</body>
</html>
