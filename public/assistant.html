<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>Olivia | AI CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="olivia.png">
    <link rel="manifest" href="manifest.json">

    <script src="push-notifications.js" defer></script>

    <style>
        :root {
            --primary: #5ce1ff;
            --primary-glow: rgba(92, 225, 255, 0.4);
            --bg: #050508;
            --card: rgba(18, 18, 24, 0.8);
            --border: rgba(92, 225, 255, 0.15);
            --text-main: #f0f4f8;
            --text-dim: #718096;
            --accent: #ff4d4d;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .hologram-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 100%);
            z-index: -1;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(92, 225, 255, 0.02) 50%);
            background-size: 100% 4px; z-index: 10; pointer-events: none;
        }

        /* Login Screen */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        .login-card { 
            background: var(--card); padding: 40px; border-radius: 30px; 
            border: 1px solid var(--border); width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 0 40px var(--primary-glow);
        }
        .login-card h1 { font-family: 'Orbitron', sans-serif; letter-spacing: 4px; margin-bottom: 30px; }
        .pw-input { 
            width: 100%; padding: 18px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--border); border-radius: 12px; 
            color: var(--primary); margin-bottom: 25px; outline: none;
            font-family: 'Orbitron', sans-serif; text-align: center;
        }
        .login-btn { 
            width: 100%; padding: 18px; background: var(--primary); 
            border: none; border-radius: 12px; color: #000; font-weight: 900; 
            font-family: 'Orbitron', sans-serif; cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow); transition: 0.3s;
        }
        .login-btn:hover { transform: scale(1.02); background: #fff; }

        #mainApp { display: none; height: 100%; flex-direction: column; }
        #mainApp.visible { display: flex; }

        header {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.4);
        }
        .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 1.2rem; display: flex; align-items: center; gap: 8px; }
        .brand span { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .system-ticker {
            font-family: 'Orbitron', sans-serif; font-size: 0.6rem; color: var(--primary);
            overflow: hidden; white-space: nowrap; border-left: 2px solid var(--primary);
            padding-left: 10px; flex: 1; margin: 0 20px;
        }

        .container { flex: 1; display: flex; flex-direction: column; padding: 20px; position: relative; overflow: hidden; }
        
        /* Central HUD Element */
        .hud-circle {
            width: 250px; height: 250px; border-radius: 50%;
            border: 2px dashed var(--border); margin: 20px auto;
            display: flex; align-items: center; justify-content: center;
            position: relative; animation: rotate 30s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hud-inner {
            width: 180px; height: 180px; border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 0.8; transform: scale(1.1); } }
        .hud-inner img { width: 100px; filter: drop-shadow(0 0 20px var(--primary)); animation: unrotate 30s linear infinite; }
        @keyframes unrotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .tab-panel { display: none; height: 100%; flex-direction: column; }
        .tab-panel.active { display: flex; }

        /* Chat Styling */
        #chatMessages { 
            flex: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 10px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; position: relative; }
        .msg.user { align-self: flex-end; background: var(--primary); color: #000; border-end-end-radius: 4px; }
        .msg.ai { align-self: flex-start; background: var(--card); border: 1px solid var(--border); border-end-start-radius: 4px; }

        .chat-input-row { display: flex; gap: 10px; background: var(--card); padding: 8px; border-radius: 20px; border: 1px solid var(--border); }
        .chat-input-row input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; }
        .send-btn { width: 45px; height: 45px; border-radius: 50%; background: var(--primary); border: none; font-size: 1.2rem; cursor: pointer; }

        /* Settings / Override */
        .setting-row { 
            display: flex; justify-content: space-between; align-items: center; 
            padding: 20px; background: var(--card); border: 1px solid var(--border);
            border-radius: 15px; margin-bottom: 12px;
        }
        .toggle { width: 50px; height: 26px; background: #333; border-radius: 30px; position: relative; cursor: pointer; }
        .toggle.active { background: var(--primary); }
        .toggle::after { content: ''; position: absolute; width: 22px; height: 22px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: 0.3s; }
        .toggle.active::after { left: 26px; }

        .bottom-nav { 
            height: 70px; display: flex; justify-content: space-around; 
            border-top: 1px solid var(--border); background: rgba(0,0,0,0.6);
            backdrop-filter: blur(20px);
        }
        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: none; border: none; color: var(--text-dim); cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-size: 0.6rem; gap: 5px;
        }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.2rem; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="hologram-bg"></div>
    <div class="scanline"></div>

    <div id="loginScreen">
        <div class="login-card">
            <h1>OLIVIA<span>_</span></h1>
            <p style="color: var(--primary); font-family: 'Orbitron'; font-size: 0.7rem; margin-bottom: 20px;">CORE ACCESS AUTHORIZATION</p>
            <input type="password" id="pwInput" class="pw-input" placeholder="PASSKEY">
            <button class="login-btn" onclick="doLogin()">AUTHORIZE</button>
            <p id="loginError" style="color: var(--accent); margin-top: 15px; font-size: 0.7rem; font-family: 'Orbitron';"></p>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <div class="brand"><h1>OLIVIA<span>CORE</span></h1></div>
            <div class="system-ticker" id="ticker">SYSTEM ONLINE // CORE READY // LINK SECURE...</div>
            <div id="waStatus" style="font-family: 'Orbitron'; font-size: 0.6rem; color: #10b981;">[ LIVE ]</div>
        </header>

        <div class="container">
            <div class="hud-circle">
                <div class="hud-inner">
                    <img src="olivia.png" alt="O" id="oliviaOrb">
                </div>
            </div>

            <div id="tab-core" class="tab-panel active">
                <div id="chatMessages"></div>
                <div class="chat-input-row">
                    <button id="voiceBtn" style="background:none; border:none; color:var(--primary); padding: 0 10px;"><i class="fas fa-microphone"></i></button>
                    <input type="text" id="chatInput" placeholder="TRANSMIT COMMAND..." onkeydown="if(event.key==='Enter') sendChat()">
                    <button class="send-btn" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="tab-intel" class="tab-panel">
                <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">SYSTEM INTEL</h2>
                <div id="leadsList" style="flex:1; overflow-y:auto;"></div>
            </div>

            <div id="tab-override" class="tab-panel">
                <h2 style="font-family: 'Orbitron'; margin-bottom: 20px;">CORE OVERRIDE</h2>
                
                <div class="setting-row">
                    <div>
                        <b style="font-family:'Orbitron'; font-size:0.8rem;">VOICE QUALITY</b><br>
                        <small style="color:var(--text-dim)">ElevenLabs Premium Neural</small>
                    </div>
                    <div id="vQualityToggle" class="toggle" onclick="toggleSetting('voiceMode', ['browser', 'elevenlabs'], this)"></div>
                </div>

                <div class="setting-row">
                    <div>
                        <b style="font-family:'Orbitron'; font-size:0.8rem;">BEHAVIORAL TONE</b><br>
                        <small style="color:var(--text-dim)">Friendly vs Sophisticated</small>
                    </div>
                    <div id="vToneToggle" class="toggle" onclick="toggleSetting('personality', ['friendly', 'sophisticated'], this)"></div>
                </div>

                <button class="login-btn" style="margin-top:20px; background:var(--accent); color:white;" onclick="logout()">TERMINATE SESSION</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('core', this)"><i class="fas fa-microchip"></i><span>CORE</span></button>
            <button class="nav-item" onclick="switchTab('intel', this)"><i class="fas fa-satellite"></i><span>INTEL</span></button>
            <button class="nav-item" onclick="switchTab('override', this)"><i class="fas fa-terminal"></i><span>OVERRIDE</span></button>
        </nav>
    </div>

    <script>
        // CONFIGURATION: Point this to your Render backend
        const BASE_URL = 'https://whatsapp-ai-bot-3-gin3.onrender.com';
        
        let password = localStorage.getItem('olivia_pass');
        let globalSettings = { voiceMode: 'browser', personality: 'sophisticated' };

        async function doLogin() {
            const inp = document.getElementById('pwInput');
            const pw = inp.value.trim() || password;
            if(!pw) return;

            try {
                const res = await fetch(`${BASE_URL}/api/settings?pass=${pw}`);
                if(res.ok) {
                    password = pw;
                    localStorage.setItem('olivia_pass', pw);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainApp').classList.add('visible');
                    globalSettings = await res.json();
                    syncLeads();
                    initSSE();
                    updateSettingsUI();
                    startTicker();
                } else {
                    document.getElementById('loginError').innerText = 'ACCESS DENIED: INVALID PASSKEY';
                }
            } catch(e) { 
                console.error('Login error:', e); 
                document.getElementById('loginError').innerText = 'CORE LINK ERROR: CHECK BACKEND';
            }
        }

        async function syncLeads() {
            try {
                const res = await fetch(`${BASE_URL}/api/logs?pass=${password}`);
                const data = await res.json();
                const list = document.getElementById('leadsList');
                list.innerHTML = Object.keys(data).map(jid => `
                    <div style="background:var(--card); border:1px solid var(--border); padding:15px; border-radius:12px; margin-bottom:10px;">
                        <span style="font-family:'Orbitron'; color:var(--primary); font-size:0.7rem;">[ SOURCE: ${jid.split('@')[0]} ]</span>
                        <p style="font-size:0.85rem; margin-top:5px; color:var(--text-dim)">${data[jid][data[jid].length-1].parts[0].text.substring(0, 50)}...</p>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if(!q) return;
            input.value = '';

            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="msg user">${q}</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch(`${BASE_URL}/api/assistant/ask?pass=${password}&q=${encodeURIComponent(q)}&model=groq`);
                const data = await res.json();
                container.innerHTML += `<div class="msg ai">${data.answer}</div>`;
                container.scrollTop = container.scrollHeight;
                
                // Trigger voice if text is short
                if(data.answer.length < 500) speak(data.answer);
            } catch(e) {}
        }

        async function speak(text) {
            if(globalSettings.voiceMode === 'elevenlabs') {
                const audio = new Audio(`${BASE_URL}/api/assistant/speak?pass=${password}&text=${encodeURIComponent(text)}`);
                audio.play();
            } else {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        function toggleSetting(key, values, el) {
            const current = globalSettings[key];
            const next = current === values[0] ? values[1] : values[0];
            globalSettings[key] = next;
            el.classList.toggle('active');
            saveGlobalSettings();
        }

        async function saveGlobalSettings() {
            await fetch(`${BASE_URL}/api/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pass: password, settings: globalSettings })
            });
        }

        function updateSettingsUI() {
            if(globalSettings.voiceMode === 'elevenlabs') document.getElementById('vQualityToggle').classList.add('active');
            if(globalSettings.personality === 'sophisticated') document.getElementById('vToneToggle').classList.add('active');
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
        }

        function initSSE() {
            const source = new EventSource(`${BASE_URL}/api/stream?pass=${password}`);
            source.onmessage = (e) => {
                if(e.data.includes('update')) syncLeads();
            };
        }

        function startTicker() {
            const tickerItems = [
                "SYSTEM STATUS: OPTIMAL",
                "CORE TEMPERATURE: 32°C",
                "LINK ENCRYPTION: 2048-BIT AES",
                "GEMINI NEURAL LINK: ACTIVE",
                "VOICE CORE: SYNCED",
                "SUBHASH IDENTIFIED: SYSTEM CREATOR"
            ];
            let i = 0;
            setInterval(() => {
                document.getElementById('ticker').innerText = "CORE // " + tickerItems[i];
                i = (i + 1) % tickerItems.length;
            }, 5000);
        }

        function logout() {
            localStorage.removeItem('olivia_pass');
            location.reload();
        }

        if(password) doLogin();
    </script>
</body>
</html>
