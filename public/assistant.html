<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>Olivia | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="olivia.png">
    <link rel="manifest" href="manifest.json">

    <!-- Push Notifications Script -->
    <script src="push-notifications.js" defer></script>

    <style>
        :root {
            --primary: #ff3344;
            --primary-glow: rgba(255, 51, 68, 0.4);
            --primary-grad: linear-gradient(135deg, #ff3344 0%, #ff7070 100%);
            --bg: #070709;
            --card: rgba(20, 20, 24, 0.6);
            --border: rgba(255, 255, 255, 0.05);
            --text-main: #ffffff;
            --text-dim: #a1a1aa;
            --accent: #0ea5e9;
            --success: #10b981;
            --glass: rgba(255, 255, 255, 0.02);
            --shadow-glass: 0 8px 32px 0 rgba(0, 0, 0, 0.4);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Status Pill */
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px; border-radius: 20px;
            font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }
        .status-connected .status-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-disconnected .status-dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-connecting .status-dot { background: #f59e0b; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Login Screen */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-card { background: var(--card); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); padding: 40px; border-radius: 32px; border: 1px solid var(--border); width: 90%; max-width: 400px; box-shadow: var(--shadow-glass), inset 0 1px 0 rgba(255, 255, 255, 0.1); }
        .pw-input { width: 100%; padding: 16px 50px 16px 20px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 16px; color: var(--text-main); margin-bottom: 20px; outline: none; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); letter-spacing: 5px; box-shadow: inset 0 2px 4px rgba(0,0,0,0.2); }
        .pw-input:focus { border-color: var(--primary); background: rgba(255, 51, 68, 0.05); box-shadow: inset 0 2px 4px rgba(0,0,0,0.2), 0 0 0 3px rgba(255, 51, 68, 0.2); }
        .login-btn { width: 100%; padding: 18px; background: var(--primary-grad); border: none; border-radius: 16px; color: #fff; font-weight: 700; cursor: pointer; transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 10px 25px var(--primary-glow), inset 0 2px 0 rgba(255,255,255,0.2); letter-spacing: 0.5px; }
        .login-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 30px var(--primary-glow), inset 0 2px 0 rgba(255,255,255,0.3); }

        #mainApp { display: none; }
        #mainApp.visible { display: block; }

        header {
            padding: 12px 16px; background: rgba(18, 18, 20, 0.9); backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 1rem; text-transform: uppercase; }
        .brand span { color: var(--primary); }

        .container { padding: 20px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--border); }
        .nav-item { color: var(--text-dim); text-align: center; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.2rem; display: block; }
        .nav-item span { font-size: 0.65rem; text-transform: uppercase; }

        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .sync-btn { background: rgba(255,255,255,0.05); color: var(--primary); border: 1px solid var(--border); padding: 6px 12px; border-radius: 12px; font-size: 0.75rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; }
        .sync-btn:active { transform: scale(0.95); }

        /* VISION EYE (v8.3 UPGRADE) */
        #visionTrigger {
            width: 32px; height: 32px;
            background: rgba(255, 77, 77, 0.1);
            border: 1.5px solid var(--primary);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            color: var(--primary);
            cursor: pointer;
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            animation: eyePulse 2.5s infinite;
            margin-right: 10px;
        }
        #visionTrigger:active { transform: scale(0.85); }
        @keyframes eyePulse {
            0% { box-shadow: 0 0 5px var(--primary-glow); transform: scale(1); }
            50% { box-shadow: 0 0 15px var(--primary-glow); transform: scale(1.05); }
            100% { box-shadow: 0 0 5px var(--primary-glow); transform: scale(1); }
        }

        #visionOverlay {
            position: fixed; inset: 0; background: black; z-index: 10006;
            display: none; overflow: hidden;
        }
        #visionVideo { width: 100%; height: 100%; object-fit: cover; }
        #visionCloseBtn {
            position: fixed; top: 20px; left: 20px; z-index: 10010;
            width: 48px; height: 48px;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(10px);
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%; color: white; font-size: 1.2rem;
            display: none; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.2s;
        }
        #visionCloseBtn:active { transform: scale(0.9); }
        .eye-scanner {
            position: absolute; top: 0; left: 0; width: 100%; height: 4px;
            background: linear-gradient(to bottom, transparent, var(--primary), transparent);
            box-shadow: 0 0 20px var(--primary);
            animation: visionScan 3s linear infinite;
            z-index: 2;
        }
        @keyframes visionScan { 0% { top: 0; } 50% { top: 100%; } 100% { top: 0; } }
        .eye-label {
            position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px);
            padding: 8px 20px; border-radius: 20px; border: 1px solid var(--primary);
            color: var(--primary); font-size: 0.75rem; font-weight: 800;
        }

        /* Toast notifications */
        .toast {
            position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%);
            background: rgba(18, 18, 20, 0.95); backdrop-filter: blur(15px);
            border: 1px solid var(--border); border-radius: 16px;
            padding: 12px 20px; color: white; display: flex; align-items: center; gap: 12px;
            z-index: 10007; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: slideUp 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes slideUp { from { transform: translate(-50%, 50px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

        /* Leads Styling */
        .lead-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; padding: 15px; }
        .lead-info { display: flex; align-items: center; gap: 12px; }
        .lead-avatar { width: 40px; height: 40px; background: #1e1e22; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .lead-preview { font-size: 0.85rem; color: var(--text-dim); margin-top: 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .model-select { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-card">
            <h1>Olivia <span>AI</span></h1>
            <p style="margin-bottom: 20px; color: var(--text-dim);">Enter Access Key</p>
            <input type="password" id="pwInput" class="pw-input" placeholder="Password...">
            <button class="login-btn" onclick="doLogin()">Enter App</button>
            <p id="loginError" style="color: var(--primary); margin-top: 10px; text-align: center; font-size: 0.8rem;"></p>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <div class="brand">
                <h1>Olivia <span>AI</span></h1>
            </div>
            
            <div style="display:flex; align-items:center;">
                <div id="visionTrigger" onclick="openVisionEye()" title="Vision Eye">
                    <i class="fas fa-eye"></i>
                </div>
                <div class="status-pill status-disconnected" id="waStatus">
                    <div class="status-dot"></div>
                    <span id="waStatusText">OFFLINE</span>
                </div>
                <select id="modelSelector" class="model-select" style="margin-left:8px;">
                    <option value="groq">Groq</option>
                    <option value="gemini">Gemini</option>
                </select>
            </div>
        </header>

        <!-- VISION EYE OVERLAY -->
        <div id="visionOverlay" onclick="captureVisionFrame()">
            <video id="visionVideo" autoplay muted playsinline webkit-playsinline></video>
            <div class="eye-scanner"></div>
            <div class="eye-label">LIVE EYE | TAP TO CAPTURE</div>
        </div>
        <!-- VISION CLOSE BUTTON -->
        <button id="visionCloseBtn" onclick="openVisionEye()" aria-label="Close Camera">
            <i class="fas fa-times"></i>
        </button>

        <div class="container">
            <div id="tab-leads" class="tab-panel active">
                <div class="section-header">
                    <h2>Chat Leads</h2>
                    <button class="sync-btn" onclick="syncLeads()"><i class="fas fa-sync-alt"></i> Sync</button>
                </div>
                <div id="leadsList">Loading conversations...</div>
            </div>
            <div id="tab-assistant" class="tab-panel">
                <div class="section-header">
                    <h2>Assistant</h2>
                </div>
                <div id="chatMessages" style="height: 400px; overflow-y: auto; margin-bottom: 20px; background: var(--card); border-radius: 15px; padding: 15px; border: 1px solid var(--border);"></div>
                <input type="text" id="chatInput" style="width: 100%; padding: 15px; background: var(--card); border: 1px solid var(--border); border-radius: 15px; color: white;" placeholder="Ask Olivia..." onkeydown="if(event.key==='Enter') sendChat()">
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" id="nav-leads" onclick="switchTab('leads', this)"><i class="fas fa-users"></i><span>Leads</span></button>
            <button class="nav-item" id="nav-assistant" onclick="switchTab('assistant', this)"><i class="fas fa-robot"></i><span>Olivia</span></button>
            <button class="nav-item"><i class="fas fa-calendar"></i><span>Events</span></button>
        </nav>
    </div>

    <script>
        const IS_FIREBASE = window.location.hostname.includes('firebaseapp.com') || window.location.hostname.includes('web.app');
        const API_BASE = IS_FIREBASE ? 'https://olivia-ai-bot-1.onrender.com' : window.location.origin;

        let password = new URLSearchParams(window.location.search).get('pass');
        if(!password) password = localStorage.getItem('olivia_pass');

        async function doLogin() {
            const inp = document.getElementById('pwInput');
            const pw = (inp && inp.value) ? inp.value.trim() : password;
            if(!pw) return;

            try {
                const res = await fetch(`${API_BASE}/api/logs?pass=${pw}`);
                if(res.ok) {
                    password = pw;
                    localStorage.setItem('olivia_pass', pw);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainApp').classList.add('visible');
                    syncLeads();
                    initSSE();
                    updateStatusUI();
                    // Polling Fallback (every 60s)
                    setInterval(syncLeads, 60000);
                } else {
                    if(document.getElementById('loginError')) document.getElementById('loginError').innerText = 'Invalid access key';
                }
            } catch(e) { console.error('Login error:', e); }
        }

        async function syncLeads() {
            if(!password) return;
            try {
                const res = await fetch(`${API_BASE}/api/logs?pass=${password}`);
                if(!res.ok) return;
                const dataRaw = await res.json();
                const data = dataRaw.logs || dataRaw; // Handle both old and new API
                const list = document.getElementById('leadsList');
                let html = '';
                Object.keys(data).sort((a,b)=>{
                    const lastA = data[a][data[a].length-1]?.time || 0;
                    const lastB = data[b][data[b].length-1]?.time || 0;
                    return new Date(lastB) - new Date(lastA);
                }).forEach(jid => {
                    const msgs = data[jid];
                    const lastMsg = msgs[msgs.length-1];
                    const text = lastMsg?.parts?.[0]?.text || lastMsg?.text || 'No text';
                    html += `
                        <div class="lead-card">
                            <div class="lead-info">
                                <div class="lead-avatar"><i class="fas fa-user"></i></div>
                                <div><b>${jid.split('@')[0]}</b><br><small style="color:var(--text-dim)">${msgs.length} messages</small></div>
                            </div>
                            <div class="lead-preview">${text}</div>
                        </div>
                    `;
                });
                list.innerHTML = html || 'No active chats found.';
            } catch(e) { console.error('Sync error:', e); }
        }

        async function updateStatusUI() {
            if(!password) return;
            try {
                const res = await fetch(`${API_BASE}/api/status?pass=${password}`);
                if(!res.ok) return;
                const data = await res.json();
                const el = document.getElementById('waStatus');
                const txt = document.getElementById('waStatusText');
                el.className = 'status-pill status-' + data.status;
                txt.innerText = data.status.toUpperCase();
            } catch(e) {}
        }

        function showToast(title, msg, icon = 'fa-info-circle', duration = 3000) {
            const t = document.createElement('div');
            t.className = 'toast';
            t.innerHTML = `<i class="fas ${icon}" style="color:var(--primary)"></i><div><b style="display:block;font-size:0.85rem">${title}</b><span style="font-size:0.75rem;opacity:0.8">${msg}</span></div>`;
            document.body.appendChild(t);
            setTimeout(() => {
                t.style.opacity = '0';
                t.style.transform = 'translate(-50%, 20px)';
                setTimeout(() => t.remove(), 500);
            }, duration);
        }

        let visionStream = null;
        async function openVisionEye() {
            const overlay = document.getElementById('visionOverlay');
            const video = document.getElementById('visionVideo');
            const closeBtn = document.getElementById('visionCloseBtn');

            if (visionStream) {
                visionStream.getTracks().forEach(t => t.stop());
                visionStream = null;
                video.srcObject = null;
                overlay.style.display = 'none';
                closeBtn.style.display = 'none';
                showToast('Eye Closed', 'Camera off.', 'fa-eye-slash');
                return;
            }

            overlay.style.display = 'block';
            closeBtn.style.display = 'flex';
            showToast('Initializing Eye', 'Starting camera...', 'fa-circle-notch fa-spin', 2000);

            try {
                try {
                    visionStream = await navigator.mediaDevices.getUserMedia({
                        video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
                    });
                } catch(e) {
                    visionStream = await navigator.mediaDevices.getUserMedia({ video: true });
                }

                video.srcObject = visionStream;
                // Nudge 1
                video.onloadedmetadata = () => { video.play().catch(()=>{}); };
                // Nudge 2
                video.oncanplay = () => { if (video.paused) video.play().catch(()=>{}); };
                // Nudge 3
                setTimeout(() => { if (video.paused && visionStream) video.play().catch(()=>{}); }, 600);
                // Nudge 4
                setTimeout(() => { if (video.paused && visionStream) video.play().catch(()=>{}); }, 1500);

            } catch(err) {
                overlay.style.display = 'none';
                closeBtn.style.display = 'none';
                let msg = 'Camera access failed.';
                if (err.name === 'NotAllowedError') msg = 'Permission denied. Tap lock icon in browser.';
                else if (err.name === 'NotFoundError') msg = 'No camera found.';
                else if (err.name === 'NotReadableError') msg = 'Camera busy. Close other apps.';
                showToast('Camera Error', msg, 'fa-exclamation-triangle', 6000);
            }
        }

        function speakText(text) {
             try {
                 const utterance = new SpeechSynthesisUtterance(text);
                 utterance.rate = 1.0;
                 utterance.pitch = 1.1;
                 window.speechSynthesis.speak(utterance);
             } catch(e) {}
        }

        async function captureVisionFrame() {
            const video = document.getElementById('visionVideo');
            const canvas = document.createElement('canvas');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            canvas.getContext('2d').drawImage(video, 0, 0);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
            
            showToast('Analyzing...', 'Processing visual data...', 'fa-brain-circuit fa-spin');
            try {
                const model = document.getElementById('modelSelector').value;
                const res = await fetch(`${API_BASE}/api/assistant/ask?pass=${password}&q=What+do+you+see?&image=${encodeURIComponent(dataUrl)}&model=${model}`);
                const data = await res.json();
                if(data.answer) {
                    showToast('Analysis Complete', 'Olivia has processed the image.', 'fa-check');
                    switchTab('assistant', document.getElementById('nav-assistant'));
                    const msgContainer = document.getElementById('chatMessages');
                    msgContainer.innerHTML += `<div style="text-align:left; margin-bottom:10px;"><span style="background:var(--card); border:1px solid var(--border); padding:8px 12px; border-radius:12px; display:inline-block;">👁️ <b>Visual Analysis:</b> ${data.answer}</span></div>`;
                    msgContainer.scrollTop = msgContainer.scrollHeight;
                }
            } catch(e) { showToast('Vision Error', 'Could not analyze image.', 'fa-times'); }
        }

        function initSSE() {
            if(!password) return;
            const statusPill = document.getElementById('waStatus');
            const statusText = document.getElementById('waStatusText');
            
            console.log('Connecting to SSE stream...');
            const source = new EventSource(`${API_BASE}/api/stream?pass=${password}`);
            
            source.onopen = () => {
                statusPill.className = 'status-pill status-connected';
                statusText.innerText = 'CONNECTED';
                console.log('SSE Stream Online');
            };

            source.onmessage = (e) => {
                const data = e.data.toLowerCase();
                if(data.includes('update')) syncLeads();
                if(data.includes('status')) updateStatusUI();
            };

            source.onerror = (e) => {
                statusPill.className = 'status-pill status-connecting';
                statusText.innerText = 'RECONNECTING...';
            };
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
            if(tab === 'leads') syncLeads();
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if(!q) return;
            input.value = '';

            const msgContainer = document.getElementById('chatMessages');
            msgContainer.innerHTML += `<div style="text-align:right; margin-bottom:10px;"><span style="background:var(--primary); padding:8px 12px; border-radius:12px; color:white; display:inline-block;">${q}</span></div>`;
            
            try {
                const model = document.getElementById('modelSelector').value;
                const res = await fetch(`${API_BASE}/api/assistant/ask?pass=${password}&q=${encodeURIComponent(q)}&model=${model}`);
                const data = await res.json();
                msgContainer.innerHTML += `<div style="text-align:left; margin-bottom:10px;"><span style="background:var(--card); border:1px solid var(--border); padding:8px 12px; border-radius:12px; display:inline-block;">${data.answer}</span></div>`;
                msgContainer.scrollTop = msgContainer.scrollHeight;
            } catch(e) { console.error('Chat error:', e); }
        }

        if(password) doLogin();
    </script>
</body>
</html>
