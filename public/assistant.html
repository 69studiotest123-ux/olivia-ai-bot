<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>Olivia | AI CORE</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="olivia.png">
    <link rel="manifest" href="manifest.json">

    <script src="push-notifications.js" defer></script>

    <style>
        :root {
            --primary: #ff4d4d;
            --primary-glow: rgba(255, 77, 77, 0.3);
            --bg: #0a0a0c;
            --card: rgba(18, 18, 20, 0.95);
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8f9fa;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        .hologram-bg {
            position: fixed; inset: 0;
            background: radial-gradient(circle at 50% 50%, #1a1a2e 0%, #050508 100%);
            z-index: -1;
        }

        .scanline {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(to bottom, transparent 50%, rgba(92, 225, 255, 0.02) 50%);
            background-size: 100% 4px; z-index: 10; pointer-events: none;
        }

        /* Login Screen */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            backdrop-filter: blur(10px);
        }
        .login-card { 
            background: var(--card); padding: 40px; border-radius: 30px; 
            border: 1px solid var(--border); width: 90%; max-width: 400px;
            text-align: center; box-shadow: 0 0 40px var(--primary-glow);
        }
        .login-card h1 { font-family: 'Orbitron', sans-serif; letter-spacing: 4px; margin-bottom: 30px; }
        .pw-input { 
            width: 100%; padding: 18px; background: rgba(0,0,0,0.5); 
            border: 1px solid var(--border); border-radius: 12px; 
            color: var(--primary); margin-bottom: 25px; outline: none;
            font-family: 'Orbitron', sans-serif; text-align: center;
        }
        .login-btn { 
            width: 100%; padding: 18px; background: var(--primary); 
            border: none; border-radius: 12px; color: #000; font-weight: 900; 
            font-family: 'Orbitron', sans-serif; cursor: pointer;
            box-shadow: 0 0 20px var(--primary-glow); transition: 0.3s;
        }

        #mainApp { display: none; height: 100%; flex-direction: column; }
        #mainApp.visible { display: flex; }

        header {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); background: rgba(0,0,0,0.7);
        }
        .brand h1 { font-family: 'Orbitron', sans-serif; font-size: 1.1rem; display: flex; align-items: center; gap: 8px; }
        .brand span { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .system-ticker {
            font-family: 'Orbitron', sans-serif; font-size: 0.55rem; color: var(--primary);
            overflow: hidden; white-space: nowrap; border-left: 2px solid var(--primary);
            padding-left: 10px; flex: 1; margin: 0 15px;
        }

        .container { flex: 1; display: flex; flex-direction: column; padding: 20px; position: relative; overflow: hidden; }
        
        .hud-circle {
            width: 220px; height: 220px; border-radius: 50%;
            border: 2px dashed var(--border); margin: 10px auto;
            display: flex; align-items: center; justify-content: center;
            position: relative; animation: rotate 30s linear infinite;
        }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .hud-inner {
            width: 160px; height: 160px; border-radius: 50%;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 0.3; transform: scale(0.9); } 50% { opacity: 0.8; transform: scale(1.1); } }
        .hud-inner img { width: 90px; filter: drop-shadow(0 0 20px var(--primary)); animation: unrotate 30s linear infinite; }
        @keyframes unrotate { from { transform: rotate(0deg); } to { transform: rotate(-360deg); } }

        .tab-panel { display: none; height: 100%; flex-direction: column; overflow-y: auto; padding-bottom: 50px; }
        .tab-panel.active { display: flex; }

        .section-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: 20px; padding: 15px; margin-bottom: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: 0.3s;
        }
        .section-card:hover { border-color: var(--primary); }

        /* Chat Styling */
        #chatMessages { flex: 1; overflow-y: auto; margin-bottom: 15px; padding-right: 5px; }
        .msg { max-width: 85%; padding: 12px; border-radius: 18px; margin-bottom: 10px; font-size: 0.9rem; }
        .msg.user { align-self: flex-end; background: var(--primary); color: #000; margin-left: auto; }
        .msg.ai { align-self: flex-start; background: rgba(50,50,60,0.8); border: 1px solid var(--border); }

        .chat-input-row { display: flex; gap: 8px; background: rgba(255,255,255,0.05); padding: 6px; border-radius: 25px; border: 1px solid var(--border); }
        .chat-input-row input { flex: 1; background: transparent; border: none; color: white; padding: 8px 12px; outline: none; font-size: 0.9rem; }
        .send-btn { width: 40px; height: 40px; border-radius: 50%; background: var(--primary); border: none; cursor: pointer; color: black; }

        /* Navigation */
        .bottom-nav { 
            height: 70px; display: flex; justify-content: space-around; 
            border-top: 1px solid var(--border); background: rgba(0,0,0,0.8);
            backdrop-filter: blur(20px); position: sticky; bottom: 0;
        }
        .nav-item { 
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
            background: none; border: none; color: var(--text-dim); cursor: pointer;
            font-family: 'Orbitron', sans-serif; font-size: 0.5rem; gap: 4px;
        }
        .nav-item.active { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }
        .nav-item i { font-size: 1.1rem; }

        /* Lists */
        .item-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .item-info b { font-family: 'Orbitron'; font-size: 0.7rem; color: var(--primary); }
        .status-tag { font-size: 0.6rem; padding: 2px 8px; border-radius: 10px; font-weight: bold; }

        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--primary); border-radius: 10px; }
    </style>
</head>
<body>
    <div class="hologram-bg"></div>
    <div class="scanline"></div>

    <div id="loginScreen">
        <div class="login-card">
            <h1>OLIVIA<span>_</span></h1>
            <p style="color: var(--primary); font-family: 'Orbitron'; font-size: 0.7rem; margin-bottom: 25px;">AUTHORIZATION REQUIRED</p>
            <input type="password" id="pwInput" class="pw-input" placeholder="PASSKEY">
            <button class="login-btn" onclick="doLogin()">AUTHORIZE</button>
            <p id="loginError" style="color: var(--accent); margin-top: 15px; font-size: 0.7rem; font-family: 'Orbitron';"></p>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <div class="brand"><h1>OLIVIA<span>CORE</span></h1></div>
            <div class="system-ticker" id="ticker">CORE STATUS: OPTIMAL // LINK: ENCRYPTED</div>
            <div id="waStatusText" style="font-family: 'Orbitron'; font-size: 0.6rem; color: var(--success);">[ LIVE ]</div>
        </header>

        <div class="container">
            <!-- HUD Sphere (Always visible in background of CORE) -->
            <div id="hudSphereContainer" style="transition:0.5s;">
                <div class="hud-circle">
                    <div class="hud-inner">
                        <img src="olivia.png" alt="O">
                    </div>
                </div>
            </div>

            <div id="tab-core" class="tab-panel active">
                <div id="chatMessages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatInput" placeholder="TRANSMIT COMMAND..." onkeydown="if(event.key==='Enter') sendChat()">
                    <button class="send-btn" onclick="sendChat()"><i class="fas fa-paper-plane"></i></button>
                </div>
            </div>

            <div id="tab-intel" class="tab-panel">
                <h2 style="font-family:'Orbitron'; font-size:1rem; margin-bottom:20px;">SATELLITE INTEL (LEADS)</h2>
                <div id="leadsList"></div>
            </div>

            <div id="tab-tasks" class="tab-panel">
                <h2 style="font-family:'Orbitron'; font-size:1rem; margin-bottom:20px;">OPERATIONAL TASKS</h2>
                <div id="taskList"></div>
            </div>

            <div id="tab-events" class="tab-panel">
                <h2 style="font-family:'Orbitron'; font-size:1rem; margin-bottom:20px;">TRANSIT CALENDAR (EVENTS)</h2>
                <div id="eventsList"></div>
            </div>

            <div id="tab-override" class="tab-panel">
                <h2 style="font-family:'Orbitron'; font-size:1rem; margin-bottom:20px;">CORE OVERRIDE</h2>
                
                <div class="section-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <b style="font-family:'Orbitron'; color:var(--primary);">VOICE MODE</b><br>
                            <small id="voiceLabel">Standard Browser</small>
                        </div>
                        <button class="send-btn" style="width:auto; padding:0 15px; border-radius:10px; font-size:0.7rem;" onclick="toggleVoice()">TOGGLE</button>
                    </div>
                </div>

                <div class="section-card">
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <b style="font-family:'Orbitron'; color:var(--primary);">PERSONALITY</b><br>
                            <small id="persLabel">Sophisticated</small>
                        </div>
                        <button class="send-btn" style="width:auto; padding:0 15px; border-radius:10px; font-size:0.7rem;" onclick="togglePersonality()">TOGGLE</button>
                    </div>
                </div>

                <button class="login-btn" style="background:var(--accent); color:white; margin-top:20px;" onclick="logout()">TERMINATE SESSION</button>
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('core', this)"><i class="fas fa-microchip"></i><span>CORE</span></button>
            <button class="nav-item" onclick="switchTab('intel', this)"><i class="fas fa-satellite"></i><span>INTEL</span></button>
            <button class="nav-item" onclick="switchTab('tasks', this)"><i class="fas fa-tasks"></i><span>TASKS</span></button>
            <button class="nav-item" onclick="switchTab('events', this)"><i class="fas fa-calendar-alt"></i><span>EVENTS</span></button>
            <button class="nav-item" onclick="switchTab('override', this)"><i class="fas fa-terminal"></i><span>OVERRIDE</span></button>
        </nav>
    </div>

    <script>
        const BASE_URL = 'https://whatsapp-ai-bot-3-gin3.onrender.com';
        let password = localStorage.getItem('olivia_pass');
        let globalSettings = { voiceMode: 'browser', personality: 'sophisticated' };

        async function doLogin() {
            const inp = document.getElementById('pwInput');
            const pw = inp.value.trim() || password;
            if(!pw) return;

            try {
                const res = await fetch(`${BASE_URL}/api/settings?pass=${pw}`);
                if(res.ok) {
                    password = pw;
                    localStorage.setItem('olivia_pass', pw);
                    document.getElementById('loginScreen').style.display = 'none';
                    document.getElementById('mainApp').classList.add('visible');
                    globalSettings = await res.json();
                    refreshAllData();
                    initSSE();
                    startTicker();
                    updateUI();
                } else {
                    document.getElementById('loginError').innerText = 'ACCESS DENIED';
                }
            } catch(e) { document.getElementById('loginError').innerText = 'LINK ERROR'; }
        }

        function refreshAllData() {
            syncLeads();
            syncTasks();
            syncEvents();
        }

        async function syncLeads() {
            try {
                const res = await fetch(`${BASE_URL}/api/logs?pass=${password}`);
                const data = await res.json();
                const list = document.getElementById('leadsList');
                list.innerHTML = Object.keys(data).sort((a,b)=>new Date(data[b][0].time) - new Date(data[a][0].time)).map(jid => `
                    <div class="section-card">
                        <div class="item-info"><b>LEAD // ${jid.split('@')[0]}</b></div>
                        <p style="font-size:0.8rem; color:var(--text-dim); margin-top:5px;">${data[jid][data[jid].length-1].parts?.[0]?.text || 'No data'}</p>
                    </div>
                `).join('');
            } catch(e) {}
        }

        async function syncTasks() {
            try {
                const res = await fetch(`${BASE_URL}/api/todos?pass=${password}`);
                const data = await res.json();
                document.getElementById('taskList').innerHTML = data.map(t => `
                    <div class="section-card">
                        <div class="item-row">
                            <span style="font-size:0.9rem;">${t.task}</span>
                            <span class="status-tag" style="background:${t.status==='completed'?'var(--success)':'var(--accent)'}">${t.status.toUpperCase()}</span>
                        </div>
                    </div>
                `).join('') || '<p style="text-align:center; color:var(--text-dim);">No active tasks, Sir.</p>';
            } catch(e) {}
        }

        async function syncEvents() {
            try {
                const res = await fetch(`${BASE_URL}/api/appointments?pass=${password}`);
                const data = await res.json();
                document.getElementById('eventsList').innerHTML = data.map(e => `
                    <div class="section-card">
                        <div class="item-info"><b>${e.service || 'Appointment'}</b></div>
                        <p style="font-size:0.8rem; color:var(--text-dim);">${e.name} | ${e.date} @ ${e.time}</p>
                    </div>
                `).join('') || '<p style="text-align:center; color:var(--text-dim);">No transits scheduled, Sir.</p>';
            } catch(e) {}
        }

        async function sendChat() {
            const input = document.getElementById('chatInput');
            const q = input.value.trim();
            if(!q) return;
            input.value = '';

            const container = document.getElementById('chatMessages');
            container.innerHTML += `<div class="msg user">${q}</div>`;
            container.scrollTop = container.scrollHeight;

            try {
                const res = await fetch(`${BASE_URL}/api/assistant/ask?pass=${password}&q=${encodeURIComponent(q)}&model=groq`);
                const data = await res.json();
                container.innerHTML += `<div class="msg ai">${data.answer}</div>`;
                container.scrollTop = container.scrollHeight;
                if(data.answer.length < 500) speak(data.answer);
            } catch(e) {}
        }

        async function speak(text) {
            if(globalSettings.voiceMode === 'elevenlabs') {
                const audio = new Audio(`${BASE_URL}/api/assistant/speak?pass=${password}&text=${encodeURIComponent(text)}`);
                audio.play();
            } else {
                const utterance = new SpeechSynthesisUtterance(text);
                window.speechSynthesis.speak(utterance);
            }
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
            
            // Hide sphere for deep data tabs
            const sphere = document.getElementById('hudSphereContainer');
            if(tab === 'core') sphere.style.display = 'block';
            else sphere.style.display = 'none';

            if(tab === 'tasks') syncTasks();
            if(tab === 'events') syncEvents();
            if(tab === 'intel') syncLeads();
        }

        function toggleVoice() {
            globalSettings.voiceMode = globalSettings.voiceMode === 'browser' ? 'elevenlabs' : 'browser';
            updateUI();
            saveSettings();
        }

        function togglePersonality() {
            globalSettings.personality = globalSettings.personality === 'sophisticated' ? 'friendly' : 'sophisticated';
            updateUI();
            saveSettings();
        }

        function updateUI() {
            document.getElementById('voiceLabel').innerText = globalSettings.voiceMode === 'elevenlabs' ? 'ElevenLabs Premium' : 'Standard Browser';
            document.getElementById('persLabel').innerText = globalSettings.personality.charAt(0).toUpperCase() + globalSettings.personality.slice(1);
        }

        async function saveSettings() {
            await fetch(`${BASE_URL}/api/settings`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ pass: password, settings: globalSettings })
            });
        }

        function initSSE() {
            const source = new EventSource(`${BASE_URL}/api/stream?pass=${password}`);
            source.onmessage = (e) => {
                const data = e.data;
                if(data.includes('update')) refreshAllData();
            };
        }

        function startTicker() {
            const items = ["GEOSYNC: ACTIVE", "MIND CORE: STABLE", "UPLINK: SECURE", "SUBHASH IDENTIFIED", "LUXURY CAR INTEL: REFRESHED"];
            let i = 0;
            setInterval(() => {
                document.getElementById('ticker').innerText = "CORE // " + items[i];
                i = (i + 1) % items.length;
            }, 4000);
        }

        function logout() { localStorage.removeItem('olivia_pass'); location.reload(); }

        if(password) doLogin();
    </script>
</body>
</html>
