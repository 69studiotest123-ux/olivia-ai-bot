<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0a0a0c">
    <title>Olivia | AI Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="olivia.png">
    <link rel="manifest" href="manifest.json">

    <style>
        :root {
            --primary: #ff4d4d;
            --primary-glow: rgba(255, 77, 77, 0.3);
            --bg: #0a0a0c;
            --card: #121214;
            --border: rgba(255, 255, 255, 0.08);
            --text-main: #f8f9fa;
            --text-dim: #94a3b8;
            --accent: #38bdf8;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            overflow-x: hidden;
            padding-bottom: 80px;
        }

        /* Status Pill */
        .status-pill {
            display: flex; align-items: center; gap: 6px;
            background: rgba(255,255,255,0.05);
            padding: 4px 10px; border-radius: 20px;
            font-size: 0.65rem; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #94a3b8; }
        .status-connected .status-dot { background: #10b981; box-shadow: 0 0 8px #10b981; }
        .status-disconnected .status-dot { background: #ef4444; box-shadow: 0 0 8px #ef4444; }
        .status-connecting .status-dot { background: #f59e0b; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }

        /* Login Screen */
        #loginScreen {
            position: fixed; inset: 0; background: var(--bg); z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .login-card { background: var(--card); padding: 32px; border-radius: 28px; border: 1px solid var(--border); width: 90%; max-width: 380px; }
        .pw-input { width: 100%; padding: 16px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 16px; color: white; margin-bottom: 20px; outline: none; }
        .login-btn { width: 100%; padding: 16px; background: var(--primary); border: none; border-radius: 16px; color: white; font-weight: 700; cursor: pointer; }

        #mainApp { display: none; }
        #mainApp.visible { display: block; }

        header {
            padding: 12px 16px; background: rgba(18, 18, 20, 0.9); backdrop-filter: blur(20px);
            border-bottom: 2px solid var(--border); position: sticky; top: 0; z-index: 1000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .brand { display: flex; align-items: center; gap: 10px; }
        .brand h1 { font-size: 1rem; text-transform: uppercase; }
        .brand span { color: var(--primary); }

        .container { padding: 20px; }
        .tab-panel { display: none; }
        .tab-panel.active { display: block; }

        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card); display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid var(--border); }
        .nav-item { color: var(--text-dim); text-align: center; cursor: pointer; background: none; border: none; }
        .nav-item.active { color: var(--primary); }
        .nav-item i { font-size: 1.2rem; display: block; }
        .nav-item span { font-size: 0.6rem; text-transform: uppercase; }

        /* Leads Styling */
        .lead-card { background: var(--card); border-radius: 20px; border: 1px solid var(--border); margin-bottom: 15px; padding: 15px; }
        .lead-info { display: flex; align-items: center; gap: 12px; }
        .lead-avatar { width: 40px; height: 40px; background: #1e1e22; border-radius: 12px; display: flex; align-items: center; justify-content: center; }
        .lead-preview { font-size: 0.85rem; color: var(--text-dim); margin-top: 10px; }

        .model-select { background: rgba(255,255,255,0.05); color: var(--text-dim); border: 1px solid var(--border); border-radius: 8px; padding: 4px 8px; font-size: 0.7rem; }
    </style>
</head>
<body>
    <div id="loginScreen">
        <div class="login-card">
            <h1>Olivia <span>AI</span></h1>
            <p style="margin-bottom: 20px; color: var(--text-dim);">Enter Access Key</p>
            <input type="password" id="pwInput" class="pw-input" placeholder="Password...">
            <button class="login-btn" onclick="doLogin()">Enter</button>
            <p id="loginError" style="color: var(--primary); margin-top: 10px; text-align: center;"></p>
        </div>
    </div>

    <div id="mainApp">
        <header>
            <div class="brand">
                <h1>Olivia <span>AI</span></h1>
            </div>
            <div class="status-pill status-disconnected" id="waStatus">
                <div class="status-dot"></div>
                <span id="waStatusText">OFFLINE</span>
            </div>
            <select id="modelSelector" class="model-select">
                <option value="groq">Groq</option>
                <option value="gemini">Gemini</option>
            </select>
        </header>

        <div class="container">
            <div id="tab-leads" class="tab-panel active">
                <h2 style="margin-bottom: 15px;">Chat Leads</h2>
                <div id="leadsList">Loading leads...</div>
            </div>
            <div id="tab-assistant" class="tab-panel">
                <h2>Assistant</h2>
                <div id="chatMessages" style="height: 400px; overflow-y: auto; margin-bottom: 20px;"></div>
                <input type="text" id="chatInput" style="width: 100%; padding: 15px; background: var(--card); border: 1px solid var(--border); border-radius: 15px; color: white;" placeholder="Ask Olivia..." onkeydown="if(event.key==='Enter') sendChat()">
            </div>
        </div>

        <nav class="bottom-nav">
            <button class="nav-item active" onclick="switchTab('leads', this)"><i class="fas fa-users"></i><span>Leads</span></button>
            <button class="nav-item" onclick="switchTab('assistant', this)"><i class="fas fa-robot"></i><span>Olivia</span></button>
            <button class="nav-item"><i class="fas fa-calendar"></i><span>Events</span></button>
        </nav>
    </div>

    <script>
        let password = new URLSearchParams(window.location.search).get('pass');
        if(!password) password = localStorage.getItem('olivia_pass');

        async function doLogin() {
            const pw = document.getElementById('pwInput').value;
            const res = await fetch(`/api/logs?pass=${pw}`);
            if(res.ok) {
                password = pw;
                localStorage.setItem('olivia_pass', pw);
                document.getElementById('loginScreen').style.display = 'none';
                document.getElementById('mainApp').classList.add('visible');
                syncLeads();
                initSSE();
                updateStatusUI();
            } else {
                document.getElementById('loginError').innerText = 'Wrong password';
            }
        }

        async function syncLeads() {
            const res = await fetch(`/api/logs?pass=${password}`);
            const data = await res.json();
            const list = document.getElementById('leadsList');
            let html = '';
            Object.keys(data).forEach(jid => {
                const msgs = data[jid];
                const last = msgs[msgs.length-1]?.parts?.[0]?.text || msgs[msgs.length-1]?.text || '';
                html += `
                    <div class="lead-card">
                        <div class="lead-info">
                            <div class="lead-avatar"><i class="fas fa-user"></i></div>
                            <div><b>${jid.split('@')[0]}</b></div>
                        </div>
                        <div class="lead-preview">${last}</div>
                    </div>
                `;
            });
            list.innerHTML = html || 'No chats yet.';
        }

        async function updateStatusUI() {
            try {
                const res = await fetch(`/api/status?pass=${password}`);
                const data = await res.json();
                const el = document.getElementById('waStatus');
                const txt = document.getElementById('waStatusText');
                el.className = 'status-pill status-' + data.status;
                txt.innerText = data.status.toUpperCase();
            } catch(e) {}
        }

        function initSSE() {
            const source = new EventSource(`/api/stream?pass=${password}`);
            source.onmessage = (e) => {
                if(e.data === 'update') syncLeads();
                if(e.data === 'status') updateStatusUI();
            };
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById('tab-' + tab).classList.add('active');
            btn.classList.add('active');
        }

        if(password) doLogin();
    </script>
</body>
</html>
