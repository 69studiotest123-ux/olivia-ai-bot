<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Olivia HomePod | Always-On</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3344;
            --primary-glow: rgba(255, 51, 68, 0.4);
            --bg: #000000;
            --text-main: #ffffff;
            --text-dim: #9ca3af;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #homepod-ui {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* DIGITAL CLOCK */
        #clock {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        #date {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* GLOWING ORB */
        .orb-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .orb-outer {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: orbPulse 4s ease-in-out infinite;
        }

        .orb-inner {
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, #ff4d4d 0%, #ff8080 100%);
            border-radius: 50%;
            box-shadow: 0 0 60px var(--primary-glow), inset 0 0 30px rgba(0,0,0,0.5);
            position: relative;
            z-index: 5;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .orb-inner i {
            font-size: 4rem;
            color: white;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
        }

        .orb-wrapper.listening .orb-inner {
            transform: scale(1.1);
            animation: orbListen 1.5s infinite;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes orbListen {
            0%, 100% { box-shadow: 0 0 60px var(--primary-glow); }
            50% { box-shadow: 0 0 100px var(--primary); }
        }

        #status-text {
            margin-top: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            letter-spacing: -0.5px;
            min-height: 2rem;
        }

        #sub-status {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 10px;
            opacity: 0.6;
        }

        /* AMBIENT BACKGROUND */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(255, 51, 68, 0.05);
            filter: blur(100px);
            border-radius: 50%;
            animation: blobFloat 20s infinite alternate;
        }
        @keyframes blobFloat {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        /* CONTROL OVERLAY */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
        }
        .btn-round {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="blob"></div>
    </div>

    <div class="top-controls">
        <a href="/" class="btn-round" title="Back to App"><i class="fas fa-home"></i></a>
        <button class="btn-round" onclick="toggleFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
    </div>

    <div id="homepod-ui">
        <div id="clock">00:00</div>
        <div id="date">LOADING INTEL...</div>

        <div class="orb-wrapper" id="orbBtn" onclick="startManualListening()">
            <div class="orb-outer"></div>
            <div class="orb-inner">
                <i class="fas fa-microphone"></i>
            </div>
        </div>

        <div id="status-text">"Olivia"</div>
        <div id="sub-status">Ready to serve, Sir Subhash.</div>
    </div>

    <script>
        let API_BASE = window.location.origin;
        let password = localStorage.getItem('olivia_pass') || '';

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // --- SPEECH LOGIC ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let wakeWordRec;
        let pttRec;

        function initHomePod() {
            if (!SpeechRec) {
                document.getElementById('status-text').innerText = "Vocal Core Not Supported";
                return;
            }
            startWakeWordListening();
        }

        function startWakeWordListening() {
            if (wakeWordRec) return;
            wakeWordRec = new SpeechRec();
            wakeWordRec.lang = 'en-US';
            wakeWordRec.continuous = true;
            wakeWordRec.interimResults = true;

            wakeWordRec.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const text = event.results[i][0].transcript.toLowerCase();
                    if (text.includes('olivia')) {
                        handleWakeWord();
                    }
                }
            };

            wakeWordRec.onend = () => { if(!pttRec) wakeWordRec.start(); };
            wakeWordRec.start();
        }

        function handleWakeWord() {
            if(pttRec) return;
            try {
                if (navigator.vibrate) navigator.vibrate([20, 100, 20]);
            } catch(e) {}
            startManualListening();
        }

        async function startManualListening() {
            if (pttRec) return;
            
            // Stop wake word while thinking
            if (wakeWordRec) { try { wakeWordRec.stop(); } catch(e){} wakeWordRec = null; }

            const orb = document.getElementById('orbBtn');
            const status = document.getElementById('status-text');
            const sub = document.getElementById('sub-status');

            orb.classList.add('listening');
            status.innerText = "I'm Listening...";
            sub.innerText = "Speak your command, Sir.";

            pttRec = new SpeechRec();
            pttRec.lang = 'en-US';
            
            pttRec.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                status.innerText = `"${text}"`;
                sub.innerText = "Olivia is thinking...";
                
                await processCommand(text);
            };

            pttRec.onend = () => {
                orb.classList.remove('listening');
                pttRec = null;
                setTimeout(startWakeWordListening, 1000);
            };

            pttRec.start();
        }

        async function processCommand(msg) {
            try {
                const res = await fetch(`${API_BASE}/api/assistant/ask?pass=${password}&q=${encodeURIComponent(msg)}&model=gemini`);
                const data = await res.json();
                
                if (data.answer) {
                    document.getElementById('status-text').innerText = "Olivia";
                    document.getElementById('sub-status').innerText = "Replying...";
                    await speakText(data.answer);
                }
            } catch (e) {
                document.getElementById('status-text').innerText = "Downlink Lost";
            }
        }

        async function speakText(text) {
            try {
                const voiceSource = localStorage.getItem('olivia_voiceSource') || 'browser';
                const voiceId = localStorage.getItem('olivia_voiceId') || '';

                if (voiceSource === 'elevenlabs') {
                    const res = await fetch(`${API_BASE}/api/assistant/tts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pass: password, text: text, voiceId: voiceId })
                    });
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    
                    document.getElementById('orbBtn').classList.add('listening');
                    audio.onended = () => { document.getElementById('orbBtn').classList.remove('listening'); };
                    audio.play();
                } else {
                    const ut = new SpeechSynthesisUtterance(text);
                    ut.onend = () => { document.getElementById('orbBtn').classList.remove('listening'); };
                    document.getElementById('orbBtn').classList.add('listening');
                    window.speechSynthesis.speak(ut);
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.onload = initHomePod;
    </script>
</body>
</html>
