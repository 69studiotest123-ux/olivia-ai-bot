<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Olivia HomePod | Always-On</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3344;
            --primary-glow: rgba(255, 51, 68, 0.4);
            --bg: #000000;
            --text-main: #ffffff;
            --text-dim: #9ca3af;
            --siri-blue: #23d5ab;
            --siri-purple: #9b59b6;
            --siri-cyan: #2980b9;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        #homepod-ui {
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* DIGITAL CLOCK */
        #clock {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -2px;
            margin-bottom: 5px;
            opacity: 0.9;
        }
        #date {
            font-size: 1.2rem;
            color: var(--text-dim);
            margin-bottom: 50px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* GLOWING ORB */
        .orb-wrapper {
            position: relative;
            width: 350px;
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .orb-outer {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, var(--primary-glow) 0%, transparent 70%);
            border-radius: 50%;
            filter: blur(40px);
            animation: orbPulse 4s ease-in-out infinite;
        }

        .orb-inner {
            width: 220px;
            height: 220px;
            background: linear-gradient(-45deg, #ee7752, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            border-radius: 50%;
            box-shadow: 0 0 80px rgba(0,0,0,0.5), inset 0 0 40px rgba(255,255,255,0.2);
            position: relative;
            z-index: 5;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .orb-inner i {
            font-size: 4rem;
            color: white;
            filter: drop-shadow(0 2px 10px rgba(0,0,0,0.3));
        }

        .orb-wrapper.listening .orb-inner {
            transform: scale(1.1);
            animation: orbListen 1.5s infinite;
        }

        @keyframes orbPulse {
            0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.5; filter: blur(40px); }
            50% { transform: scale(1.3) rotate(180deg); opacity: 0.9; filter: blur(60px); }
        }

        @keyframes orbListen {
            0%, 100% { box-shadow: 0 0 60px var(--primary-glow); }
            50% { box-shadow: 0 0 100px var(--primary); }
        }

        /* TIMER DISPLAY */
        #timer-box {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255,255,255,0.05);
            padding: 15px 30px;
            border-radius: 50px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.1);
            display: none;
            align-items: center;
            gap: 15px;
            z-index: 20;
            animation: slideUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #timer-val { font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
        #timer-label { font-size: 0.8rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }

        @keyframes slideUp {
            from { transform: translate(-50%, 100px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }

        /* MUSIC STATUS */
        #music-status {
            margin-top: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            opacity: 0.6;
            font-size: 0.9rem;
        }
        .bar { width: 3px; height: 10px; background: var(--primary); border-radius: 5px; animation: barMove 1s infinite alternate; }
        .bar:nth-child(2) { animation-delay: 0.2s; }
        .bar:nth-child(3) { animation-delay: 0.4s; }
        @keyframes barMove { from { height: 5px; } to { height: 15px; } }

        #status-text {
            margin-top: 50px;
            font-size: 1.5rem;
            font-weight: 600;
            color: white;
            letter-spacing: -0.5px;
            min-height: 2rem;
        }

        #sub-status {
            font-size: 0.9rem;
            color: var(--text-dim);
            margin-top: 10px;
            opacity: 0.6;
        }

        /* AMBIENT BACKGROUND */
        .ambient-bg {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
        }
        .blob {
            position: absolute;
            width: 600px;
            height: 600px;
            background: rgba(255, 51, 68, 0.05);
            filter: blur(100px);
            border-radius: 50%;
            animation: blobFloat 20s infinite alternate;
        }
        @keyframes blobFloat {
            from { transform: translate(-20%, -20%); }
            to { transform: translate(20%, 20%); }
        }

        /* CONTROL OVERLAY */
        .top-controls {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            display: flex;
            gap: 15px;
        }
        .btn-round {
            width: 50px;
            height: 50px;
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="ambient-bg">
        <div class="blob"></div>
    </div>

    <div class="top-controls">
        <a href="/" class="btn-round" title="Back to App"><i class="fas fa-home"></i></a>
        <button class="btn-round" onclick="toggleFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
    </div>

    <div id="homepod-ui">
        <div id="clock">00:00</div>
        <div id="date">LOADING INTEL...</div>

        <div class="orb-wrapper" id="orbBtn" onclick="startManualListening()">
            <div class="orb-outer"></div>
            <div class="orb-inner">
                <i class="fas fa-microphone"></i>
            </div>
        </div>

        <div id="status-text">"Olivia"</div>
        <div id="sub-status">Ready to serve, Sir Subhash.</div>

        <div id="music-status">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div>
            <span>HomePod Active</span>
        </div>
    </div>

    <div id="timer-box">
        <i class="fas fa-hourglass-half" style="color: var(--primary);"></i>
        <div>
            <div id="timer-val">00:00</div>
            <div id="timer-label">Timer Active</div>
        </div>
    </div>

    <script>
        const IS_FIREBASE = window.location.hostname.includes('firebaseapp.com') || window.location.hostname.includes('web.app');
        const API_BASE = IS_FIREBASE ? 'https://olivia-ai-bot-1.onrender.com' : window.location.origin;
        let password = new URLSearchParams(window.location.search).get('pass') || localStorage.getItem('olivia_pass');

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleFullscreen() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // --- SPEECH LOGIC ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let wakeWordRec;
        let pttRec;

        function initHomePod() {
            if (!SpeechRec) {
                document.getElementById('status-text').innerText = "Vocal Core Not Supported";
                return;
            }
            startWakeWordListening();
            initSSE();
        }

        // --- REAL-TIME SYNC ---
        function initSSE() {
            if (!password) return;
            const eventSource = new EventSource(`${API_BASE}/api/stream?pass=${password}`);
            eventSource.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'timer') {
                        startVisualTimer(data.duration);
                    } else if (data.type === 'music') {
                        playMusic(data.query);
                    }
                } catch(err) {}
            };
            eventSource.onerror = () => {
                eventSource.close();
                setTimeout(initSSE, 5000);
            };
        }

        let timerInterval;
        function startVisualTimer(seconds) {
            clearInterval(timerInterval);
            const box = document.getElementById('timer-box');
            const val = document.getElementById('timer-val');
            box.style.display = 'flex';
            
            let remaining = seconds;
            const updateUI = () => {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                val.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    box.style.background = 'rgba(255, 51, 68, 0.2)';
                    setTimeout(() => box.style.display = 'none', 5000);
                    new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
                }
                remaining--;
            };
            updateUI();
            timerInterval = setInterval(updateUI, 1000);
        }

        function playMusic(query) {
            const status = document.getElementById('music-status');
            status.innerHTML = `<div class="bar"></div><div class="bar"></div><div class="bar"></div><span>Playing: ${query}</span>`;
            status.style.opacity = "1";
            
            // Open YouTube Music search in a popup/new tab
            const url = `https://music.youtube.com/search?q=${encodeURIComponent(query)}`;
            window.open(url, '_blank');
        }

        function startWakeWordListening() {
            if (wakeWordRec) return;
            wakeWordRec = new SpeechRec();
            wakeWordRec.lang = 'en-US';
            wakeWordRec.continuous = true;
            wakeWordRec.interimResults = true;

            wakeWordRec.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const text = event.results[i][0].transcript.toLowerCase();
                    if (text.includes('olivia')) {
                        handleWakeWord();
                    }
                }
            };

            wakeWordRec.onend = () => { if(!pttRec) wakeWordRec.start(); };
            wakeWordRec.start();
        }

        function handleWakeWord() {
            if(pttRec) return;
            try {
                if (navigator.vibrate) navigator.vibrate([20, 100, 20]);
            } catch(e) {}
            startManualListening();
        }

        async function startManualListening() {
            if (pttRec) return;
            
            // Stop wake word while thinking
            if (wakeWordRec) { try { wakeWordRec.stop(); } catch(e){} wakeWordRec = null; }

            const orb = document.getElementById('orbBtn');
            const status = document.getElementById('status-text');
            const sub = document.getElementById('sub-status');

            orb.classList.add('listening');
            status.innerText = "I'm Listening...";
            sub.innerText = "Speak your command, Sir.";

            pttRec = new SpeechRec();
            pttRec.lang = 'en-US';
            
            pttRec.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                status.innerText = `"${text}"`;
                sub.innerText = "Olivia is thinking...";
                
                await processCommand(text);
            };

            pttRec.onend = () => {
                orb.classList.remove('listening');
                pttRec = null;
                setTimeout(startWakeWordListening, 1000);
            };

            pttRec.start();
        }

        async function processCommand(msg) {
            if (!password) {
                window.location.href = '/?error=session_expired';
                return;
            }
            try {
                const model = localStorage.getItem('olivia_currentModel') || 'groq';
                const res = await fetch(`${API_BASE}/api/assistant/ask?pass=${password}&q=${encodeURIComponent(msg)}&model=${model}`);
                const data = await res.json();
                
                if (data.answer) {
                    const fullText = data.answer;
                    // Extract natural text (remove anything in [BRACKETS])
                    const naturalText = fullText.replace(/\[.+?\]/g, '').trim();
                    const systemInfo = (fullText.match(/\[.+?\]/g) || []).join(' ');

                    document.getElementById('status-text').innerText = "Olivia";
                    document.getElementById('sub-status').innerText = systemInfo || "Responding...";
                    
                    await speakText(naturalText || "Command executed, Sir.");
                } else if (data.error) {
                    document.getElementById('status-text').innerText = "System Error";
                    document.getElementById('sub-status').innerText = data.error;
                }
            } catch (e) {
                document.getElementById('status-text').innerText = "Downlink Lost";
            }
        }

        async function speakText(text) {
            try {
                const voiceSource = localStorage.getItem('olivia_voiceSource') || 'browser';
                const voiceId = localStorage.getItem('olivia_voiceId') || '';

                if (voiceSource === 'elevenlabs') {
                    const res = await fetch(`${API_BASE}/api/assistant/tts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pass: password, text: text, voiceId: voiceId })
                    });
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    
                    document.getElementById('orbBtn').classList.add('listening');
                    audio.onended = () => { document.getElementById('orbBtn').classList.remove('listening'); };
                    audio.play();
                } else {
                    const ut = new SpeechSynthesisUtterance(text);
                    const voices = window.speechSynthesis.getVoices();
                    
                    const preferredVoice = voices.find(v => v.name.includes('Google US English') && v.name.includes('Female')) ||
                                         voices.find(v => v.name.includes('Microsoft Zira')) ||
                                         voices.find(v => v.name.includes('Samantha')) ||
                                         voices.find(v => (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman') || v.name.toLowerCase().includes('girl')) && v.lang.includes('en'));
                    
                    if (preferredVoice) ut.voice = preferredVoice;
                    ut.pitch = 1.1; // More feminine
                    ut.rate = 1.0;

                    ut.onend = () => { document.getElementById('orbBtn').classList.remove('listening'); };
                    document.getElementById('orbBtn').classList.add('listening');
                    window.speechSynthesis.speak(ut);
                }
            } catch (e) {
                console.error(e);
            }
        }

        window.onload = initHomePod;
    </script>
</body>
</html>
