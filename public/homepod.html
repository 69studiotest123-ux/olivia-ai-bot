<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Olivia HomePod | Always-On</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ff3344;
            --primary-glow: rgba(255, 51, 68, 0.4);
            --bg: #050508;
            --text-main: #ffffff;
            --text-dim: rgba(255, 255, 255, 0.5);
            --accent: #38bdf8;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            position: relative;
        }

        /* --- DYNAMIC BACKGROUND --- */
        .ambient-engine {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background: radial-gradient(circle at 50% 50%, #111, #000);
        }

        .light-blob {
            position: absolute;
            width: 800px;
            height: 800px;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 25s infinite alternate ease-in-out;
        }

        .blob-1 { background: var(--primary); top: -20%; left: -10%; animation-delay: 0s; }
        .blob-2 { background: var(--accent); bottom: -20%; right: -10%; animation-delay: -5s; }
        .blob-3 { background: #a855f7; top: 40%; left: 30%; width: 600px; height: 600px; animation-delay: -10s; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(100px, 50px) scale(1.2); }
        }

        #homepod-ui {
            text-align: center;
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 600px;
            padding: 20px;
        }

        /* --- TIME & DATE --- */
        .time-container {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        #clock {
            font-size: 6.5rem;
            font-weight: 800;
            letter-spacing: -4px;
            line-height: 1;
            background: linear-gradient(to bottom, #fff, #888);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            drop-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        #date {
            font-size: 1rem;
            color: var(--text-dim);
            text-transform: uppercase;
            letter-spacing: 5px;
            margin-top: 5px;
            font-weight: 600;
        }

        /* --- THE ULTIMATE ORB --- */
        .orb-portal {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.5s;
        }

        .orb-portal:active { transform: scale(0.95); }

        .orb-ring {
            position: absolute;
            inset: 0;
            border: 1px solid rgba(255, 51, 68, 0.1);
            border-radius: 50%;
            animation: ringRotate 10s linear infinite;
        }

        .ring-2 { inset: 20px; border-color: rgba(56, 189, 248, 0.1); animation-duration: 15s; animation-direction: reverse; }
        .ring-3 { inset: 40px; border-color: rgba(168, 85, 247, 0.1); animation-duration: 20s; }

        @keyframes ringRotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .orb-core {
            width: 200px;
            height: 200px;
            background: linear-gradient(-45deg, #ff3344, #ff7744, #38bdf8, #a855f7);
            background-size: 400% 400%;
            border-radius: 50%;
            position: relative;
            z-index: 5;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 
                0 0 100px rgba(255, 51, 68, 0.3),
                inset 0 0 50px rgba(0,0,0,0.5);
            animation: coreMorph 15s ease infinite alternate, coreGlow 4s infinite;
            transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes coreMorph {
            0% { border-radius: 50% 50% 50% 50%; background-position: 0% 50%; }
            50% { border-radius: 45% 55% 48% 52%; background-position: 100% 50%; }
            100% { border-radius: 52% 48% 55% 45%; background-position: 0% 50%; }
        }

        @keyframes coreGlow {
            0%, 100% { box-shadow: 0 0 80px rgba(255, 51, 68, 0.2); }
            50% { box-shadow: 0 0 120px rgba(255, 51, 68, 0.5); }
        }

        .orb-core i {
            font-size: 3.5rem;
            color: white;
            filter: drop-shadow(0 4px 10px rgba(0,0,0,0.4));
        }

        /* LISTENING STATE */
        .listening .orb-core {
            transform: scale(1.15);
            animation: coreListen 1s infinite alternate;
        }

        @keyframes coreListen {
            from { box-shadow: 0 0 100px var(--primary); }
            to { box-shadow: 0 0 150px var(--primary); }
        }

        /* --- STATUS BAR --- */
        .status-glass {
            margin-top: 50px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            padding: 20px 40px;
            border-radius: 100px;
            display: inline-flex;
            flex-direction: column;
            gap: 5px;
            animation: fadeInUp 1s ease-out;
            box-shadow: 0 20px 50px rgba(0,0,0,0.3);
        }

        #status-text {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            letter-spacing: -0.5px;
        }

        #sub-status {
            font-size: 0.85rem;
            color: var(--text-dim);
            letter-spacing: 0.5px;
        }

        /* --- MUSIC VISUALIZER --- */
        #music-status {
            margin-top: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            opacity: 0.8;
        }

        .wave-bar {
            width: 4px;
            height: 12px;
            background: var(--primary);
            border-radius: 10px;
            animation: waveBounce 1s infinite alternate;
        }
        .wave-bar:nth-child(2) { animation-delay: 0.1s; background: #ff7744; }
        .wave-bar:nth-child(3) { animation-delay: 0.2s; background: #a855f7; }
        .wave-bar:nth-child(4) { animation-delay: 0.3s; background: var(--accent); }

        @keyframes waveBounce {
            from { height: 10px; opacity: 0.4; }
            to { height: 24px; opacity: 1; }
        }

        /* --- TOP CONTROLS --- */
        .top-dash {
            position: fixed;
            top: 30px;
            right: 30px;
            display: flex;
            gap: 15px;
            z-index: 100;
        }

        .glass-btn {
            width: 54px;
            height: 54px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            backdrop-filter: blur(10px);
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
        }

        .glass-btn:hover { background: rgba(255,255,255,0.1); transform: translateY(-3px); }

        /* --- KIOSK MODE ENHANCEMENTS --- */
        .top-dash {
            transition: opacity 0.5s ease;
        }

        .top-dash.hide { opacity: 0; pointer-events: none; }

        body.kiosk-mode { cursor: none; }
        
        #kiosk-status {
            position: fixed;
            bottom: 20px;
            right: 20px;
            font-size: 0.6rem;
            color: var(--text-dim);
            opacity: 0.4;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 100;
        }

        /* --- BRANDING --- */
        .brand-top {
            position: fixed;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 100;
            animation: fadeIn 1.5s ease;
        }

        .brand-top img {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            border: 1px solid var(--primary);
        }

        .brand-top h2 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            margin: 0;
        }

        .brand-top span { color: var(--primary); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* ANIMATIONS */
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* --- MOBILE ADAPTATION --- */
        @media (max-width: 480px) {
            #clock { font-size: 4.5rem; }
            .orb-portal { width: 280px; height: 280px; }
            .orb-core { width: 160px; height: 160px; }
            .status-glass { padding: 15px 25px; width: 90%; }
        }
    </style>
</head>
<body>
    <div class="ambient-engine">
        <div class="light-blob blob-1"></div>
        <div class="light-blob blob-2"></div>
        <div class="light-blob blob-3"></div>
    </div>

    <div class="brand-top">
        <img src="/olivia.png" alt="Olivia" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=O&background=ff4d4d&color=fff';">
        <h2>OLIVIA <span>AI</span></h2>
    </div>

    <div class="top-dash">
        <a href="/" class="glass-btn" title="Back to App"><i class="fas fa-home"></i></a>
        <button class="glass-btn" onclick="toggleFullscreen()" title="Fullscreen"><i class="fas fa-expand"></i></button>
    </div>

    <div id="homepod-ui">
        <div id="kiosk-status">Always-On Display Active</div>
        <!-- Embedded Silent Video (v8.25) -->
        <video id="wakeLockVideo" loop muted playsinline style="position:fixed; top:0; left:0; width:1px; height:1px; opacity:0.01; pointer-events:none;">
            <source src="data:video/mp4;base64,AAAAHGZ0eXBpc29tAAAAAGlzb21pc28yYXZjMWFhYmMAAABkbW9vdvAAAABsbXZoZAAAAADREu8A0RLvAAACWAAAAnEAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAwAAABB0cmFrAAAAXHRraGQAAAAD0RLvANES7wAAAAEAAAAAAAAnEAAAAAAAAAAAAAAAAAABAAAAAAABAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAApBtZGlhAAAAIG1kaGQAAAAA0RLvANES7wAAALhAAAC4AFhlAAAAAAAAbWhscgAAAAAAAAAAdmlkZQAAAAAAAAAAAAAAAG1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAAAgkaG1oZAAAAAAAc3RibAAAAFBzdHNkAAAAAAAAAAEAAABQYXZjMQAAAAAAAAAAAAAAAAAAAAAAAQAWAAAAFAAAABQAAABhdmNDAVQAKv/hABhnVAAK78AsAtIAAAMEAAACvA8SLP8AAbO9AAAAEHBhc3AAAAABAAAAAQAAABhzdHRzAAAAAAAAAAEAAAABAAAAOAAAABxzdHNjAAAAAAAAAAEAAAABAAAAAQAAAAEAAAAUc3RzeAAAAAAAAAEAAAABAAAADHN0c28AAAAAAAAAAhAAABBzdHN6AAAAAAAAAAAAAAABAAAALnN0Y28AAAAAAAAAAQAAADQAAABIdWR0YQAAADBtZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyAAAAAAAAAAAAAAAAAAAAAAAAYXBwbAAAAAhtbm90AAAAAA==" type="video/mp4">
        </video>
        <div class="time-container">
            <div id="clock">00:00</div>
            <div id="date">SYNCING INTEL...</div>
        </div>

        <div class="orb-portal" id="orbBtn" onclick="startManualListening()">
            <div class="orb-ring ring-1"></div>
            <div class="orb-ring ring-2"></div>
            <div class="orb-ring ring-3"></div>
            <div class="orb-core">
                <i class="fas fa-microphone"></i>
            </div>
        </div>

        <div class="status-glass">
            <div id="status-text">"Olivia v8.25"</div>
            <div id="sub-status">Ready for your command, Sir.</div>
        </div>

        <div id="music-status">
            <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
            <span style="font-size:0.75rem; text-transform:uppercase; letter-spacing:1px; font-weight:700; opacity:0.6;">HomePod Active</span>
        </div>
    </div>

    <div id="timer-box">
        <i class="fas fa-hourglass-half" style="color: var(--primary);"></i>
        <div>
            <div id="timer-val">00:00</div>
            <div id="timer-label">Timer Active</div>
        </div>
    </div>

    <script>
        const API_BASE = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') 
            ? window.location.origin 
            : 'https://olivia-ai-bot-1.onrender.com';
        let password = new URLSearchParams(window.location.search).get('pass') || localStorage.getItem('olivia_pass');

        function updateClock() {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false });
            document.getElementById('date').innerText = now.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric' });
        }
        setInterval(updateClock, 1000);
        updateClock();

        function toggleFullscreen() {
            const el = document.documentElement;
            if (!document.fullscreenElement && !document.webkitFullscreenElement && !document.mozFullScreenElement && !document.msFullscreenElement) {
                if (el.requestFullscreen) el.requestFullscreen();
                else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
                else if (el.mozRequestFullScreen) el.mozRequestFullScreen();
                else if (el.msRequestFullscreen) el.msRequestFullscreen();
            } else {
                if (document.exitFullscreen) document.exitFullscreen();
                else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
                else if (document.mozCancelFullScreen) document.mozCancelFullScreen();
                else if (document.msExitFullscreen) document.msExitFullscreen();
            }
        }

        // --- SPEECH LOGIC ---
        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        let wakeWordRec;
        let pttRec;

        function initHomePod() {
            if (!SpeechRec) {
                document.getElementById('status-text').innerText = "Vocal Core Not Supported";
                return;
            }
            // We wait for first click to start listening to comply with browser policies
            document.getElementById('status-text').innerText = "V8.23 Active";
            document.getElementById('sub-status').innerText = "Tap Orb to initialize Voice core.";
            initSSE();
        }

        // --- REAL-TIME SYNC ---
        function initSSE() {
            if (!password) return;
            const eventSource = new EventSource(`${API_BASE}/api/stream?pass=${password}`);
            eventSource.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    if (data.type === 'timer') {
                        startVisualTimer(data.duration);
                    } else if (data.type === 'music') {
                        playMusic(data.query);
                    }
                } catch(err) {}
            };
            eventSource.onerror = () => {
                eventSource.close();
                setTimeout(initSSE, 5000);
            };
        }

        let timerInterval;
        function startVisualTimer(seconds) {
            clearInterval(timerInterval);
            const box = document.getElementById('timer-box');
            const val = document.getElementById('timer-val');
            box.style.display = 'flex';
            
            let remaining = seconds;
            const updateUI = () => {
                const m = Math.floor(remaining / 60);
                const s = remaining % 60;
                val.innerText = `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    box.style.background = 'rgba(255, 51, 68, 0.2)';
                    setTimeout(() => box.style.display = 'none', 5000);
                    new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play();
                }
                remaining--;
            };
            updateUI();
            timerInterval = setInterval(updateUI, 1000);
        }

        function playMusic(query) {
            const status = document.getElementById('music-status');
            status.innerHTML = `<div class="bar"></div><div class="bar"></div><div class="bar"></div><span>Playing: ${query}</span>`;
            status.style.opacity = "1";
            
            // Open YouTube Music search in a popup/new tab
            const url = `https://music.youtube.com/search?q=${encodeURIComponent(query)}`;
            window.open(url, '_blank');
        }

        function startWakeWordListening() {
            if (wakeWordRec) return;
            wakeWordRec = new SpeechRec();
            wakeWordRec.lang = 'en-US';
            wakeWordRec.continuous = true;
            wakeWordRec.interimResults = true;

            wakeWordRec.onresult = (event) => {
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    const text = event.results[i][0].transcript.toLowerCase();
                    if (text.includes('olivia')) {
                        handleWakeWord();
                    }
                }
            };

            wakeWordRec.onend = () => { if(!pttRec) wakeWordRec.start(); };
            wakeWordRec.start();
        }

        function handleWakeWord() {
            if(pttRec) return;
            try {
                if (navigator.vibrate) navigator.vibrate([20, 100, 20]);
            } catch(e) {}
            startManualListening();
        }

        async function startManualListening() {
            if (pttRec) return;
            
            // Ensure wake word core is stopped or at least not already running
            if (wakeWordRec) { 
                try { wakeWordRec.stop(); } catch(e){} 
                wakeWordRec = null; 
            } else {
                // If it wasn't running, it means this is the first interaction - let's toast!
                console.log("Voice Engine Initialized via Interaction.");
            }

            const orb = document.getElementById('orbBtn');
            const status = document.getElementById('status-text');
            const sub = document.getElementById('sub-status');

            orb.classList.add('listening');
            status.innerText = "I'm Listening...";
            sub.innerText = "Speak your command, Sir.";

            pttRec = new SpeechRec();
            pttRec.lang = 'en-US';
            
            pttRec.onresult = async (event) => {
                const text = event.results[0][0].transcript;
                status.innerText = `"${text}"`;
                sub.innerText = "Olivia is thinking...";
                
                await processCommand(text);
            };

            pttRec.onend = () => {
                document.getElementById('orbBtn').classList.remove('listening');
                pttRec = null;
                setTimeout(startWakeWordListening, 1000);
            };

            pttRec.start();
        }

        async function processCommand(msg) {
            if (!password) {
                document.getElementById('status-text').innerText = "Session Expired";
                document.getElementById('sub-status').innerText = "Please open HomePod from the main app.";
                setTimeout(() => window.location.href = '/?error=session_expired', 3000);
                return;
            }
            try {
                const model = localStorage.getItem('olivia_currentModel') || 'groq';
                const res = await fetch(`${API_BASE}/api/assistant/ask?pass=${password}&q=${encodeURIComponent(msg)}&model=${model}`);
                const data = await res.json();
                
                if (data.answer) {
                    const fullText = data.answer;
                    // Extract natural text (remove anything in [BRACKETS])
                    const naturalText = fullText.replace(/\[.+?\]/g, '').trim();
                    const systemInfo = (fullText.match(/\[.+?\]/g) || []).join(' ');

                    document.getElementById('status-text').innerText = "Olivia";
                    document.getElementById('sub-status').innerText = systemInfo || "Responding...";
                    
                    await speakText(naturalText || "Command executed, Sir.");
                } else if (data.error) {
                    document.getElementById('status-text').innerText = "System Error";
                    document.getElementById('sub-status').innerText = data.error;
                }
            } catch (e) {
                document.getElementById('status-text').innerText = "Downlink Lost";
            }
        }

        async function speakText(text) {
            try {
                const voiceSource = localStorage.getItem('olivia_voiceSource') || 'browser';
                const voiceId = localStorage.getItem('olivia_voiceId') || '';

                if (voiceSource === 'elevenlabs') {
                    const res = await fetch(`${API_BASE}/api/assistant/tts`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pass: password, text: text, voiceId: voiceId })
                    });
                    const blob = await res.blob();
                    const audio = new Audio(URL.createObjectURL(blob));
                    
                    document.getElementById('orbBtn').classList.add('listening');
                    audio.onended = () => { document.getElementById('orbBtn').classList.remove('listening'); };
                    audio.play();
                } else {
                    const ut = new SpeechSynthesisUtterance(text);
                    const voices = window.speechSynthesis.getVoices();
                    
                    const preferredVoice = voices.find(v => v.name.includes('Google US English') && v.name.includes('Female')) ||
                                         voices.find(v => v.name.includes('Microsoft Zira')) ||
                                         voices.find(v => v.name.includes('Samantha')) ||
                                         voices.find(v => (v.name.toLowerCase().includes('female') || v.name.toLowerCase().includes('woman') || v.name.toLowerCase().includes('girl')) && v.lang.includes('en'));
                    
                    if (preferredVoice) ut.voice = preferredVoice;
                    ut.pitch = 1.1; // More feminine
                    ut.rate = 1.0;

                    ut.onend = () => { document.getElementById('orbBtn').classList.remove('listening'); };
                    document.getElementById('orbBtn').classList.add('listening');
                    window.speechSynthesis.speak(ut);
                }
            } catch (e) {
                console.error(e);
            }
        }

        // --- KIOSK MODE LOGIC ---
        let inactivityTimer;
        function resetInactivity() {
            const dash = document.querySelector('.top-dash');
            if (dash) dash.classList.remove('hide');
            document.body.classList.remove('kiosk-mode');
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                const dash = document.querySelector('.top-dash');
                if (dash) dash.classList.add('hide');
                if (document.fullscreenElement) document.body.classList.add('kiosk-mode');
            }, 8000);
        }

        window.addEventListener('mousemove', resetInactivity);
        window.addEventListener('touchstart', resetInactivity);
        resetInactivity();

        // NO-SLEEP LOGIC (Dual approach: WakeLock API + Silent Video)
        let wakeLock = null;
        async function requestWakeLock() {
            // Approach 1: Try Native WakeLock API
            try {
                if ('wakeLock' in navigator && navigator.wakeLock.request) {
                    wakeLock = await navigator.wakeLock.request('screen');
                    console.log("Native Wake Lock Active.");
                }
            } catch (err) { console.warn("Native WakeLock failed."); }

            // Approach 2: Embedded Silent Video (v8.25)
            const video = document.getElementById('wakeLockVideo');
            if (video) {
                video.play().then(() => {
                    console.log("Embedded Video Wake Lock Active.");
                    // Heartbeat to ensure video playback isn't killed by OS
                    setInterval(() => {
                        if (video.paused && !document.hidden) video.play().catch(() => {});
                    }, 5000);
                }).catch(e => {
                    console.warn("Video Wake Lock activation failed on this device.", e);
                });
            }
        }

        // Re-request on visibility change
        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') requestWakeLock();
        });

        // Trigger wake lock and fullscreen on first interaction
        const originalStartManualListening = startManualListening;
        startManualListening = async function() {
            requestWakeLock();
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                try { toggleFullscreen(); } catch(e){}
            }
            await originalStartManualListening();
        };

        window.onload = initHomePod;
    </script>
</body>
</html>
